name: Validate online server

on:
  pull_request:
    paths:
      - "src/index.js"
      - "wrangler.toml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
