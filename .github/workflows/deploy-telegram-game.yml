name: Deploy Telegram game Worker

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/game-entry.js"
      - "wrangler-game.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-game-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy orange-meadow-ad87
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Telegram game Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler-game.toml
