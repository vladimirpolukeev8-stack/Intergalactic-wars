name: Deploy Intergalactic Wars online Worker

on:
  push:
    branches: [main]
    paths:
      - "src/index.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-online-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intergalactic-wars-online-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy online matchmaking and social API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate online Worker JavaScript
        run: node --check src/index.js
      - name: Configure Telegram bot token when repository secret is available
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4.166.0 secret put TELEGRAM_BOT_TOKEN --config wrangler.toml
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler.toml
